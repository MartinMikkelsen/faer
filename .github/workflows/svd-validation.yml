name: Scheduled SVD validation

on:
  schedule:
    - cron: '23 3 * * 1' # Mondays, 03:23 UTC / 12:23 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-svd-validation
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Record environment
        run: |
          {
            git rev-parse HEAD
            uname -a
            rustc -Vv
          } | tee svd-environment.log
      - name: Build SVD test binary
        run: |
          /usr/bin/time -p cargo test -p t4a-faer --lib --locked --no-run 2>&1 | tee svd-build.log
      - name: Run ordinary and opt-in SVD tests
        timeout-minutes: 2
        run: |
          /usr/bin/time -p cargo test -p t4a-faer --lib --locked linalg::svd::tests -- --include-ignored --nocapture --test-threads=1 2>&1 | tee svd-validation.log
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svd-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: svd-*.log
          retention-days: 30

  report-failure:
    needs: validation
    # A job that exceeds `timeout-minutes` ends as `cancelled`. Scheduled runs
    # use the default branch; manual runs on other branches stay out of its
    # issue.
    if: ${{ always() && (needs.validation.result == 'failure' || needs.validation.result == 'cancelled') && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Update the scheduled validation issue
        uses: actions/github-script@v9
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        with:
          script: |
            const repo = context.repo;
            const label = 'scheduled-svd-validation';
            const title = 'Scheduled SVD validation is failing';
            try {
              await github.rest.issues.getLabel({ ...repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...repo, name: label, color: 'B60205',
                description: 'Failures in the scheduled LAPACK SVD validation',
              });
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'open', labels: label, per_page: 100,
            });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            const run = `${process.env.GITHUB_SERVER_URL}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const result = process.env.VALIDATION_RESULT;
            const failure = [
              `Failed run: ${run}`,
              `Event: ${context.eventName}, ref: ${context.ref}, commit: ${context.sha}`,
              `Validation result: ${result}${result === 'cancelled' ? ' (a timeout or a manual cancel)' : ''}`,
            ].join('\n');
            if (issue) {
              await github.rest.issues.createComment({ ...repo, issue_number: issue.number, body: failure });
            } else {
              const body = [
                failure,
                '',
                'See the job logs and svd-validation artifact for the environment, build timing, and numerical failures.',
                'The workflow runs ordinary SVD tests and all ignored LAPACK pilot groups. Known failures remain failures.',
                'Each later failure adds a comment here. Close this issue after a green run.',
                'Coverage and local reproduction: docs/lapack-svd-pilot.md.',
              ].join('\n');
              await github.rest.issues.create({ ...repo, title, body, labels: [label] });
            }
